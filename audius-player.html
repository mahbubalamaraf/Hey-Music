<!DOCTYPE html>
<html lang="bn">
<head>

<title>hey music</title>
<script>
(function(){var t=null,l=null;try{t=localStorage.getItem("hm_theme");l=localStorage.getItem("hm_lang")}catch(e){}

document.documentElement.setAttribute("data-theme",t);document.documentElement.lang=l||"bn"})();

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f4f2fa;--card:#fff;--tx:#17141f;--mu:#78738e;--bd:#e7e3f2;--g:linear-gradient(135deg,#7c3aed,#ec4899);--ac:#7c3aed;--glass:rgba(255,255,255,.85)}
[data-theme=dark]{--bg:#000;--card:#0b0b0d;--tx:#f5f5f7;--mu:#8e8e99;--bd:#1b1b20;--ac:#a78bfa;--glass:rgba(0,0,0,.88)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:180px;transition:background .25s}
button{border:0;cursor:pointer;font-family:inherit;color:inherit;background:none;display:inline-flex;align-items:center;justify-content:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:currentColor;stroke-width:1}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.bt{display:flex;flex-direction:column;justify-content:center;min-width:0}
.bn{font-size:20px;font-weight:700;line-height:1.1}
.by{font-size:13px;font-weight:500;line-height:1.2;margin-top:2px;color:var(--mu)}
.by a{color:var(--ac);font-weight:600;text-decoration:none}
.by a:active{opacity:.6}
.logo{width:36px;height:36px;border-radius:12px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center}
.logo svg{width:20px;height:20px}
.tools{display:flex;align-items:center;gap:10px}
.lg{gap:4px;height:30px;padding:0 10px;border-radius:15px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:600}
.lg svg{width:15px;height:15px}
.lg.on{color:var(--ac);border-color:var(--ac)}
label.sb2{display:inline-flex;align-items:center;cursor:pointer}
.sb{position:relative}
.sb svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mu)}
#q{width:100%;padding:13px 16px 13px 44px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;outline:none;transition:.2s}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 2px;gap:8px}
.sl{display:flex;align-items:center;gap:6px;min-width:0}
.sl h2{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa{display:flex;gap:4px}
.sb2{gap:6px;font-size:13px;font-weight:500;color:var(--ac);padding:7px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.sb2 svg{width:16px;height:16px}
.sec .ro{width:36px;height:36px;border-radius:12px}
#list{padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 8px;border-radius:18px;background:var(--card);cursor:pointer;border:1px solid var(--bd);transition:.15s}
.it:active{transform:scale(.985)}
.it.cur{border-color:var(--ac)}
.th{position:relative;width:54px;height:54px;flex:none}
.th img{width:100%;height:100%;border-radius:14px;object-fit:cover;background:var(--bd)}
.plt{border-radius:14px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center}
.eq{display:none;position:absolute;top:0;left:0;right:0;bottom:0;border-radius:14px;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center;gap:3px;padding-bottom:16px}
.it.cur .eq{display:flex}
.eq i{width:3px;height:16px;background:#fff;border-radius:2px;transform-origin:bottom;animation:b .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.pause .eq i{animation-play-state:paused}
@keyframes b{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.m{min-width:0;flex:1}
.t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:12.5px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{font-size:12px;color:var(--mu)}
.ib{width:38px;height:38px;border-radius:50%;color:var(--mu);flex:none}
.ib svg{width:19px;height:19px}
#msg{text-align:center;color:var(--mu);padding:40px 16px;font-size:14px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px))}
#bar{position:relative;overflow:hidden;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:22px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px}
.np{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.np img{width:46px;height:46px;border-radius:13px;object-fit:cover;background:var(--bd);flex:none}
.np>div{min-width:0}
.mc{display:flex;align-items:center}
.mc button{width:42px;height:42px;border-radius:50%}
.mc .pp{background:var(--g);color:#fff}
.mc .pp svg{width:20px;height:20px}
.mp{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--bd)}
.mp i{display:block;height:100%;width:0;background:var(--g)}
/* liquid glass nav */
:root{--blob-1:#ff2a5f;--blob-2:#007aff;--blob-3:#ff9500;--blob-opacity:.3;
--glass-bg:rgba(255,255,255,.15);--glass-border:rgba(255,255,255,.4);--glass-shadow:rgba(0,0,0,.1);--glass-highlight:rgba(255,255,255,.8);--glass-caustic:rgba(255,255,255,.4);
--reflection-start:rgba(255,255,255,.6);--reflection-end:rgba(255,255,255,0);--glare-color:rgba(255,255,255,.5);
--pill-bg:rgba(255,255,255,.7);--pill-shadow:0 4px 12px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.8);
--icon-color:rgba(0,0,0,.5);--icon-active:rgba(0,0,0,.95);--divider:rgba(0,0,0,.15)}
[data-theme=dark]{--blob-1:#bf5af2;--blob-2:#0a84ff;--blob-3:#ff375f;--blob-opacity:.4;
--glass-bg:rgba(30,30,35,.45);--glass-border:rgba(255,255,255,.15);--glass-shadow:rgba(0,0,0,.8);--glass-highlight:rgba(255,255,255,.25);--glass-caustic:rgba(255,255,255,.05);
--reflection-start:rgba(255,255,255,.15);--reflection-end:rgba(255,255,255,0);--glare-color:rgba(255,255,255,.15);
--pill-bg:rgba(60,60,65,.8);--pill-shadow:0 4px 12px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.2);
--icon-color:rgba(255,255,255,.5);--icon-active:#fff;--divider:rgba(255,255,255,.15)}
.bg-mesh{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--blob-opacity);animation:lqfloat 20s infinite alternate cubic-bezier(.45,.05,.55,.95);will-change:transform;transition:background .8s,opacity .8s}
.blob-1{width:50vw;height:50vw;top:-10%;left:-10%;background:var(--blob-1)}
.blob-2{width:45vw;height:45vw;bottom:-10%;right:-10%;background:var(--blob-2);animation-delay:-5s}
.blob-3{width:35vw;height:35vw;top:30%;left:40%;background:var(--blob-3);animation-delay:-10s}
@keyframes lqfloat{0%{transform:translate(0,0) scale(1) rotate(0)}33%{transform:translate(5%,10%) scale(1.05) rotate(5deg)}66%{transform:translate(-5%,5%) scale(.95) rotate(-5deg)}100%{transform:translate(0,-10%) scale(1.1) rotate(0)}}
.liquid-nav{position:relative;display:flex;align-items:center;width:100%;margin-top:8px;padding:8px;border-radius:99px;
background:var(--glass-bg);backdrop-filter:blur(50px) saturate(200%);-webkit-backdrop-filter:blur(50px) saturate(200%);
box-shadow:0 40px 80px -20px var(--glass-shadow),0 10px 30px -10px var(--glass-shadow),inset 0 2px 3px -1px var(--glass-highlight),inset 0 -2px 4px -1px var(--glass-caustic),inset 0 0 0 1px var(--glass-border);
transition:background .5s,box-shadow .5s}
.liquid-nav::before{content:"";position:absolute;top:1px;left:1px;right:1px;height:46%;border-radius:99px 99px 24px 24px/99px 99px 12px 12px;background:linear-gradient(180deg,var(--reflection-start) 0%,var(--reflection-end) 100%);pointer-events:none;z-index:6;transition:background .5s}
.liquid-glare-container{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:99px;overflow:hidden;pointer-events:none;z-index:5}
.liquid-glare{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity .3s;background:radial-gradient(circle 90px at var(--x,50%) var(--y,50%),var(--glare-color) 0%,transparent 100%);mix-blend-mode:overlay}
.liquid-nav:hover .liquid-glare{opacity:1}
.nav-items{position:relative;display:flex;flex:1;min-width:0;gap:4px;z-index:3}
.active-pill{position:absolute;top:0;left:0;height:44px;width:0;background:var(--pill-bg);border-radius:99px;box-shadow:var(--pill-shadow);transition:transform .5s cubic-bezier(.34,1.2,.64,1),width .5s cubic-bezier(.34,1.2,.64,1),background .5s,box-shadow .5s;z-index:1}
.nav-btn{position:relative;flex:1 1 0;min-width:0;height:44px;padding:0 6px;border-radius:99px;font-size:13px;font-weight:600;color:var(--icon-color);outline:none;transition:color .3s;z-index:2}
.btn-content{display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;pointer-events:none;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.btn-content svg.i{width:19px;height:19px;flex:none}
.btn-content span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn:active .btn-content{transform:scale(.92)}
.nav-btn.active{color:var(--icon-active)}
.divider{width:1px;height:24px;background:var(--divider);margin:0 4px;z-index:3;transition:background .5s}
.theme-btn{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:var(--icon-color);outline:none;margin-left:2px;z-index:3;transition:color .3s}
.theme-btn:hover,.theme-btn:active{color:var(--icon-active)}
.theme-icon-wrapper{position:relative;width:20px;height:20px;pointer-events:none;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.theme-btn:active .theme-icon-wrapper{transform:scale(.8)}
.theme-icon-wrapper span{position:absolute;top:0;left:0;width:20px;height:20px;display:flex;transition:transform .5s cubic-bezier(.34,1.2,.64,1),opacity .4s}
.theme-icon-wrapper svg.i{width:20px;height:20px}
.lq-sun{opacity:1;transform:rotate(0) scale(1)}
.lq-moon{opacity:0;transform:rotate(-90deg) scale(0)}
[data-theme=dark] .lq-sun{opacity:0;transform:rotate(90deg) scale(0)}
[data-theme=dark] .lq-moon{opacity:1;transform:rotate(0) scale(1)}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
/* liquid glass tabs */
:root{--lt-bg:rgba(23,20,31,.07)}
[data-theme=dark]{--lt-bg:rgba(255,255,255,.08)}
.liquid-nav.lt{margin-top:12px;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--lt-bg);
box-shadow:0 8px 24px -14px var(--glass-shadow),inset 0 2px 3px -1px var(--glass-highlight),inset 0 -2px 4px -1px var(--glass-caustic),inset 0 0 0 1px var(--glass-border)}
.lt .liquid-glare{background:radial-gradient(circle 70px at var(--x,50%) var(--y,50%),var(--glare-color) 0%,transparent 100%)}
.tabs{position:relative;display:flex;flex:1;min-width:0;gap:4px;padding:4px;overflow-x:auto;scrollbar-width:none;border-radius:99px;z-index:3;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:none;height:36px;padding:0 16px;border-radius:99px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--icon-color);outline:none;z-index:2;transition:color .3s,transform .2s cubic-bezier(.32,.72,0,1)}
.tabs button:active{transform:scale(.94)}
.tabs button.on{color:var(--icon-active)}
.tab-pill{position:absolute;top:4px;left:0;width:0;height:36px;border-radius:99px;background:var(--pill-bg);box-shadow:var(--pill-shadow);opacity:0;pointer-events:none;z-index:1;
transition:transform .5s cubic-bezier(.34,1.2,.64,1),width .5s cubic-bezier(.34,1.2,.64,1),opacity .3s,background .5s,box-shadow .5s}
@media(prefers-reduced-motion:reduce){.tab-pill{transition:none}}
/* lyrics */
.ph button.on{color:var(--ac);border-color:var(--ac)}
.pa{min-height:0}
#lyr{display:none;position:relative;align-self:stretch;width:100%;height:100%;overflow-y:auto;scrollbar-width:none;text-align:center;overscroll-behavior:contain;
-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
#lyr::-webkit-scrollbar{display:none}
#pop.ly .big{display:none}
#pop.ly #lyr{display:block}
#pop.ly #lyr.msg{display:flex;align-items:center;justify-content:center}
#lyr.has{padding:30vh 0}
.lm{color:var(--mu);font-size:14px;padding:0 20px}
.ll{font-size:22px;font-weight:700;line-height:1.4;padding:9px 4px;color:var(--tx);opacity:.35;cursor:pointer;transform-origin:center;transition:opacity .35s,transform .35s}
.ll.on{opacity:1;transform:scale(1.04)}
.lp{font-size:18px;font-weight:600;line-height:1.75;white-space:pre-wrap;padding:22px 4px 8px;color:var(--tx);opacity:.92}
.lc{font-size:11px;color:var(--mu);padding:14px 0 6px}
@media(prefers-reduced-motion:reduce){.ll{transition:none}}
.hid{display:none!important}
/* popup */
#pop{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));overflow:hidden;transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s}
#pop.open{transform:none;visibility:visible}
#pbg{position:absolute;top:-10%;left:-10%;right:-10%;bottom:-10%;background-size:cover;background-position:center;filter:blur(60px);opacity:.35}
#pop>div:not(#pbg){position:relative}
.ph{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:var(--mu)}
.ph button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.pa{flex:1;display:flex;align-items:center;justify-content:center}
.big{width:min(78vw,340px);aspect-ratio:1;border-radius:28px;object-fit:cover;background:var(--bd);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pi{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pi .t{font-size:21px}
.pi .a{font-size:14px}
.pr{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:11px;color:var(--mu)}
input[type=range]{flex:1;height:20px;accent-color:var(--ac);background:none;border:0;padding:0;margin:0}
.ct{display:flex;justify-content:center;align-items:center;gap:14px}
.ct button{width:48px;height:48px;border-radius:50%;color:var(--mu)}
.ct button.on{color:var(--ac)}
.ct .nv{color:var(--tx)}
.ct .pp{width:66px;height:66px;background:var(--g);color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.4)}
.ct .pp svg{width:28px;height:28px}
/* modal */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
.sheet{width:100%;max-width:520px;background:var(--card);border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto}
.sheet h3{font-size:17px;margin-bottom:14px}
.nr{display:flex;gap:8px;margin-bottom:12px}
.nr input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:none}
.ok{height:46px;padding:0 16px;border-radius:14px;background:var(--g);color:#fff;font-weight:600;font-size:14px;gap:6px}
.pk{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:6px;background:var(--bg);border:1px solid var(--bd);font-size:15px;text-align:left}
.pk small{color:var(--ac)}
.pk svg{width:18px;height:18px}
.row2{display:flex;gap:8px;margin-top:6px}.row2 button{flex:1;height:46px;border-radius:14px;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.row2 .dg{background:#e11d48;color:#fff;border:0}
#toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>

const L={
bn:{lyLoad:"লিরিক্স খোঁজা হচ্ছে...",lyNone:"এই গানের লিরিক্স পাওয়া যায়নি",lyErr:"লিরিক্স লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।",lyInst:"এটি একটি ইনস্ট্রুমেন্টাল গান",ph:"গান বা শিল্পী খুঁজুন",explore:"এক্সপ্লোর",history:"ইতিহাস",playlists:"প্লেলিস্ট",nowPlaying:"এখন চলছে",idle:"কোনো গান চলছে না",tap:"একটি গানে ট্যাপ করুন",loading:"লোড হচ্ছে...",err:"গান লোড করা যায়নি",none:"কোনো গান পাওয়া যায়নি",noHist:"এখনো কোনো গান শোনা হয়নি",clear:"মুছুন",newPl:"নতুন",newPlT:"নতুন প্লেলিস্ট",plName:"প্লেলিস্টের নাম",create:"তৈরি",addTo:"প্লেলিস্টে যোগ করুন",noPl:"কোনো প্লেলিস্ট নেই। উপরে নাম লিখে তৈরি করুন।",noPl2:"এখনো কোনো প্লেলিস্ট নেই",emptyPl:"এই প্লেলিস্ট খালি। গানের পাশে + চাপুন।",songs:"টি গান",added:"যোগ হয়েছে",already:"আগেই আছে",yes:"হ্যাঁ",cancel:"বাতিল",delPl:"এই প্লেলিস্ট মুছে ফেলবেন?",clrH:"পুরো ইতিহাস মুছে ফেলবেন?",trending:"ট্রেন্ডিং",Electronic:"ইলেকট্রনিক","Hip-Hop/Rap":"হিপ-হপ","Lo-Fi":"লো-ফাই",Pop:"পপ",Rock:"রক",Acoustic:"অ্যাকোস্টিক",Ambient:"অ্যাম্বিয়েন্ট",Devotional:"ভক্তিমূলক",tag:"BN",local:"আমার গান",addSong:"গান যোগ",noLoc:"এখনো কোনো গান যোগ করা হয়নি। উপরের “গান যোগ” চেপে ফাইল থেকে গান বেছে নিন।",delSong:"এই গানটি মুছে ফেলবেন?",addedN:"টি গান যোগ হয়েছে",memOnly:"স্টোরেজে সেভ হয়নি, শুধু এই সেশনে চলবে",notAudio:"এটি অডিও ফাইল নয়"},
en:{lyLoad:"Finding lyrics...",lyNone:"No lyrics found for this song",lyErr:"Couldn't load lyrics. Check your connection and try again.",lyInst:"This is an instrumental track",ph:"Search songs or artists",explore:"Explore",history:"History",playlists:"Playlists",nowPlaying:"Now playing",idle:"Nothing playing",tap:"Tap a song to start",loading:"Loading...",err:"Couldn't load songs",none:"No songs found",noHist:"No songs played yet",clear:"Clear",newPl:"New",newPlT:"New playlist",plName:"Playlist name",create:"Create",addTo:"Add to playlist",noPl:"No playlists yet. Type a name above to create one.",noPl2:"No playlists yet",emptyPl:"This playlist is empty. Tap + next to a song.",songs:" songs",added:"Added",already:"Already in playlist",yes:"Yes",cancel:"Cancel",delPl:"Delete this playlist?",clrH:"Clear all history?",trending:"Trending",tag:"EN",local:"My Music",addSong:"Add songs",noLoc:"No songs yet. Tap “Add songs” to pick audio files from your device.",delSong:"Remove this song?",addedN:" song(s) added",memOnly:"Couldn't save to storage; plays this session only",notAudio:"Not an audio file"}
};
let lang=ls("hm_lang")||"bn";if(!L[lang])lang="bn";
const T=k=>L[lang][k]||k;
const GEN=["trending","Electronic","Hip-Hop/Rap","Lo-Fi","Pop","Rock","Acoustic","Ambient","Devotional"];
const au=$("au");
let shown=[],queue=[],cur=null,shuffle=false,repeat=false,tab=0,view="explore",pid=null,mode="add",results=[],pickT=null;
let hist=jl("hm_hist"),pls=jl("hm_pl");
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PH="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M85 140V68l50-9v70"/><circle cx="72" cy="140" r="13"/><circle cx="122" cy="129" r="13"/></g></svg>');
const art=(t,b)=>{if(t.local)return lcov(t)||PH;const a=t.artwork||{};return b?(a["480x480"]||a["150x150"]||""):(a["150x150"]||a["480x480"]||"")};
const lite=t=>({id:t.id,title:t.title,user:{name:t.user&&t.user.name||""},duration:t.duration,artwork:t.artwork,is_streamable:true,local:!!t.local});
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),1600)}
all("[data-ic]",e=>e.innerHTML=ic(e.dataset.ic));

/* theme & language */
function setTheme(t){document.documentElement.setAttribute("data-theme",t);sv("hm_theme",t);document.querySelector('meta[name=theme-color]').content=t==="dark"?"#000000":"#f4f2fa"}
$("theme-btn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
setTheme(document.documentElement.getAttribute("data-theme"));
function applyLang(){
  document.documentElement.lang=lang;sv("hm_lang",lang);$("lgt").textContent=T("tag");
  all("[data-t]",e=>e.textContent=T(e.dataset.t));all("[data-p]",e=>e.placeholder=T(e.dataset.p));
  $("tabs").innerHTML='<div class="tab-pill" id="tpill"></div>';GEN.forEach((g,i)=>{const b=document.createElement("button");b.textContent=T(g);b.onclick=()=>{tab=i;$("q").value="";load();mark()};$("tabs").appendChild(b)});
  mark();movePillT(false);if(!cur)setNow(null);render();if(ly.id)renderLy();
}
$("lm").onclick=()=>setView(view==="local"?"explore":"local");
$("lg").onclick=()=>{lang=lang==="bn"?"en":"bn";applyLang()};
function movePillT(smooth){const p=$("tpill");if(!p)return;const b=$("tabs").querySelector("button.on");
  if(!b){p.style.opacity="0";return}
  p.style.transition=smooth?"":"none";p.style.width=b.offsetWidth+"px";p.style.transform="translateX("+b.offsetLeft+"px)";p.style.opacity="1";
  if(!smooth){void p.offsetWidth;p.style.transition=""}}
function mark(){let moved=false;$("tabs").querySelectorAll("button").forEach((b,i)=>{const on=i===tab&&!$("q").value.trim();const was=b.classList.contains("on");b.classList.toggle("on",on);if(on&&!was){moved=true;try{b.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})}catch(e){}}});movePillT(moved)}
window.addEventListener("resize",()=>movePillT(false));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{movePillT(false);movePill(false)});

/* data */
async function api(p){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(API+p+(p.includes("?")?"&":"?")+"app_name="+APP,{signal:c.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);return(await r.json()).data||[]}finally{clearTimeout(tm)}
}
async function load(){
  if(view==="explore"){$("list").innerHTML="";$("msg").textContent=T("loading")}
  try{
    const q=$("q").value.trim();let d;
    if(q)d=await api("/tracks/search?limit=40&query="+encodeURIComponent(q));
    else if(tab===0)d=await api("/tracks/trending?limit=40");
    else d=await api("/tracks/trending?limit=40&genre="+encodeURIComponent(GEN[tab]));
    results=d.filter(t=>t.is_streamable!==false);
    if(view==="explore")render();
  }catch(e){if(view==="explore")$("msg").textContent=T("err")+" ("+(e&&e.message||e)+")"}
}

/* rendering */
function row(t,i){return`<div class="it${cur&&cur.id===t.id?" cur":""}" data-i="${i}"><div class="th"><img src="${art(t)}" loading="lazy" alt=""><div class="eq"><i></i><i></i><i></i></div></div><div class="m"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.user&&t.user.name||"")}</div></div><span class="d">${fmt(t.duration)}</span>${t.local&&mode==="loc"?`<button class="ib" data-act="add" data-i="${i}">${ic("pu")}</button>`:""}<button class="ib" data-act="${mode}" data-i="${i}">${ic(mode==="rm"||mode==="loc"?"x":"pu")}</button></div>`}
function show(list,m,empty){shown=list;mode=m||"add";$("list").innerHTML=list.map(row).join("");$("msg").textContent=list.length?"":(empty||T("none"))}
function head(title,left,right){const h=$("hsec");h.classList.remove("hid");h.innerHTML=`<div class="sl">${left||""}<h2>${esc(title)}</h2></div><div class="sa">${right||""}</div>`}
function render(){
  $("sbox").classList.toggle("hid",view!=="explore");
  const nv=view==="plist"?"playlists":view;all(".nav-btn",b=>b.classList.toggle("active",b.dataset.v===nv));movePill(true);pill.style.opacity=view==="local"?"0":"1";$("lm").classList.toggle("on",view==="local");
  if(view==="explore"){$("hsec").classList.add("hid");show(results)}
  else if(view==="history"){head(T("history"),"",`<button class="sb2" data-h="clr">${ic("tr")}${T("clear")}</button>`);show(hist,"add",T("noHist"))}
  else if(view==="local"){head(T("local"),"",`<label class="sb2" for="fi">${ic("pu")}${T("addSong")}</label>`);show(loc,"loc",T("noLoc"))}
  else if(view==="playlists"){
    head(T("playlists"),"",`<button class="sb2" data-h="new">${ic("pu")}${T("newPl")}</button>`);
    shown=[];$("list").innerHTML=pls.map(p=>`<div class="it" data-p="${p.id}"><div class="th plt">${ic("lm")}</div><div class="m"><div class="t">${esc(p.name)}</div><div class="a">${p.tracks.length}${T("songs")}</div></div></div>`).join("");
    $("msg").textContent=pls.length?"":T("noPl2");
  }else if(view==="plist"){
    const p=pls.find(x=>x.id===pid);if(!p){view="playlists";return render()}
    head(p.name,`<button class="ib ro" data-h="back">${ic("al")}</button>`,`<button class="ib ro" data-h="all">${ic("pl","f")}</button><button class="ib ro" data-h="del">${ic("tr")}</button>`);
    show(p.tracks,"rm",T("emptyPl"));
  }
}
function setView(v){view=v;window.scrollTo(0,0);render();if(v==="explore"&&!results.length)load()}
all(".nav-btn",b=>b.onclick=()=>setView(b.dataset.v));
/* liquid nav: sliding pill, glare, theme button */
const pill=$("active-pill"),lnav=$("lnav"),glare=$("glare");
function movePill(smooth){const b=document.querySelector(".nav-btn.active");if(!b||!b.offsetWidth)return;
  pill.style.transition=smooth?"":"none";pill.style.width=b.offsetWidth+"px";pill.style.transform="translateX("+b.offsetLeft+"px)";
  if(!smooth){void pill.offsetWidth;pill.style.transition=""}}
if(window.ResizeObserver)new ResizeObserver(()=>movePill(false)).observe($("navitems"));
window.addEventListener("resize",()=>movePill(false));
[[lnav,glare],[$("ltabs"),$("tglare")]].forEach(([el,gl])=>["pointermove","pointerdown"].forEach(ev=>el.addEventListener(ev,e=>{const r=el.getBoundingClientRect();gl.style.setProperty("--x",(e.clientX-r.left)+"px");gl.style.setProperty("--y",(e.clientY-r.top)+"px")})));

/* player */
function setNow(t){
  all(".ntr",e=>e.textContent=t?t.title:T("idle"));all(".nar",e=>e.textContent=t?(t.user&&t.user.name||""):T("tap"));
  if(t){all(".cvr",e=>e.src=art(t,e.classList.contains("big")));$("pbg").style.backgroundImage=`url("${art(t)}")`}
}
function play(t){
  cur=t;
  if(t.local){dbGet(t.id).then(r=>{if(cur!==t)return;if(!r){toast(T("none"));return}if(objU)URL.revokeObjectURL(objU);objU=URL.createObjectURL(r.file);au.src=objU;au.play().catch(()=>{})})}
  else au.src=`${API}/tracks/${t.id}/stream?app_name=${APP}`,au.play().catch(()=>{});
  setNow(t);setMeta(t);if(lyOn)loadLy();all(".it[data-i]",el=>el.classList.toggle("cur",!!shown[+el.dataset.i]&&shown[+el.dataset.i].id===t.id));
}
const pos=()=>queue.findIndex(t=>cur&&t.id===cur.id);
function next(auto){
  if(!queue.length)return;if(auto&&repeat)return play(cur);
  let n=shuffle?Math.floor(Math.random()*queue.length):pos()+1;if(n>=queue.length)n=0;play(queue[n]);
}
function prev(){if(au.currentTime>3)au.currentTime=0;else{const p=pos();play(queue[p>0?p-1:queue.length-1])}}
function toggle(){if(!cur){if(shown.length){queue=shown.slice();play(shown[0])}return}au.paused?au.play():au.pause()}
function addHist(t){hist=[lite(t),...hist.filter(h=>h.id!==t.id)].slice(0,60);sv("hm_hist",JSON.stringify(hist));if(view==="history")render()}
function setMeta(t){
  if(!("mediaSession"in navigator))return;const a=t.local?(lcov(t)?{"512x512":lcov(t)}:{}):(t.artwork||{});
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.user&&t.user.name||"",album:"hey music",artwork:Object.keys(a).map(k=>({src:a[k],sizes:k,type:"image/jpeg"}))});
}
if("mediaSession"in navigator){const m=navigator.mediaSession;
  m.setActionHandler("play",()=>au.play());m.setActionHandler("pause",()=>au.pause());
  m.setActionHandler("previoustrack",prev);m.setActionHandler("nexttrack",()=>next(false));
  m.setActionHandler("seekto",d=>{au.currentTime=d.seekTime})}
au.addEventListener("play",()=>{all(".ppb",e=>e.innerHTML=ic("pa"));document.body.classList.remove("pause");if(cur)addHist(cur);if(navigator.mediaSession)navigator.mediaSession.playbackState="playing"});
au.addEventListener("pause",()=>{all(".ppb",e=>e.innerHTML=ic("pl"));document.body.classList.add("pause");if(navigator.mediaSession)navigator.mediaSession.playbackState="paused"});
au.addEventListener("ended",()=>next(true));
au.addEventListener("error",()=>{if(cur)setTimeout(()=>next(false),800)});
au.addEventListener("timeupdate",()=>{if(!au.duration)return;const p=au.currentTime/au.duration*100;
  all(".cu",e=>e.textContent=fmt(au.currentTime));all(".du",e=>e.textContent=fmt(au.duration));all(".sk",e=>e.value=p);$("mpi").style.width=p+"%"});
all(".sk",e=>e.oninput=x=>{if(au.duration)au.currentTime=x.target.value/100*au.duration});
all(".ppb",e=>e.onclick=toggle);$("nx").onclick=$("nx0").onclick=()=>next(false);$("pv").onclick=prev;
$("sh").onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle("on",shuffle)};
$("rp").onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle("on",repeat)};

/* lyrics (LRCLIB) */
const lyCache=new Map(),enc=encodeURIComponent;
let ly={id:null,st:"load"},lyOn=ls("hm_ly")==="1",lyIdx=-1,lyU=0;
const lyClean=x=>String(x||"").replace(/[\(\[\{].*?[\)\]\}]/g," ").replace(/\b(feat|ft|prod)\b\.?.*$/i," ").replace(/\s+/g," ").trim();
function lyParse(x){const out=[];String(x).split("\n").forEach(l=>{const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];const tx=l.replace(/\[[^\]]*\]/g,"").trim();m.forEach(a=>out.push({t:+a[1]*60+ +a[2],x:tx}))});return out.sort((a,b)=>a.t-b.t)}
async function lyGet(qs){const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);try{const r=await fetch("https://lrclib.net/api/search?"+qs,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}}
function lyPick(arr,ds,tol){if(!Array.isArray(arr))return null;let best=null,bd=1e9;
  arr.forEach(h=>{if(!(h.syncedLyrics||h.plainLyrics||h.instrumental))return;const d=Math.abs((h.duration||0)-ds)-(h.syncedLyrics?.5:0);if(d<bd){bd=d;best=h}});
  return best&&bd<=tol?best:null}
async function fetchLy(t){
  if(lyCache.has(t.id))return lyCache.get(t.id);
  const ti=lyClean(t.title)||t.title,ar=(t.user&&t.user.name||"").trim(),ds=t.duration||0;
  const steps=[[`track_name=${enc(ti)}`+(ar?`&artist_name=${enc(ar)}`:""),ds?15:1e9],[`q=${enc(ti+" "+ar)}`,ds?10:1e9]];
  if(ds)steps.push([`track_name=${enc(ti)}`,3]);
  let hit=null,fail=0;
  for(const [qs,tol] of steps){try{hit=lyPick(await lyGet(qs),ds,tol)}catch(e){fail++}if(hit)break}
  if(!hit&&fail===steps.length)throw new Error("net");
  let d={none:1};
  if(hit){const lines=hit.syncedLyrics?lyParse(hit.syncedLyrics):null;
    d={lines:lines&&lines.length?lines:null,plain:hit.plainLyrics||"",inst:!!hit.instrumental&&!hit.plainLyrics&&!hit.syncedLyrics}}
  lyCache.set(t.id,d);return d}
function renderLy(){
  const b=$("lyr");lyIdx=-1;let msg=null;
  if(ly.st==="load")msg=T("lyLoad");else if(ly.st==="err")msg=T("lyErr");else if(ly.none)msg=T("lyNone");else if(ly.inst)msg=T("lyInst");
  b.classList.toggle("msg",!!msg);b.classList.toggle("has",!msg&&!!ly.lines);
  const cr='<div class="lc">Lyrics · LRCLIB</div>';
  if(msg)b.innerHTML=`<div class="lm">${esc(msg)}</div>`;
  else if(ly.lines)b.innerHTML=ly.lines.map(l=>`<div class="ll" data-s="${l.t}">${esc(l.x)||"♪"}</div>`).join("")+cr;
  else b.innerHTML=`<div class="lp">${esc(ly.plain)}</div>`+cr;
  b.scrollTop=0;lySync(true)}
async function loadLy(){
  const t=cur;if(!t)return;
  if(ly.id===t.id&&ly.st!=="load"&&ly.st!=="err"){return}
  ly={id:t.id,st:"load"};renderLy();
  let d;try{d=await fetchLy(t)}catch(e){d=null}
  if(!cur||cur.id!==t.id)return;
  ly=d?{id:t.id,st:"ok",...d}:{id:t.id,st:"err"};renderLy()}
function lySync(force){
  if(!lyOn||ly.st!=="ok"||!ly.lines)return;
  const L=ly.lines,ct=au.currentTime+.3;let i=-1;
  for(let k=0;k<L.length;k++){if(L[k].t<=ct)i=k;else break}
  if(i===lyIdx&&!force)return;
  const els=$("lyr").children;
  if(lyIdx>=0&&els[lyIdx])els[lyIdx].classList.remove("on");
  lyIdx=i;if(i<0||!els[i])return;
  els[i].classList.add("on");
  if(Date.now()-lyU>3000){const b=$("lyr");b.scrollTo({top:els[i].offsetTop-b.clientHeight/2+els[i].offsetHeight/2,behavior:force?"auto":"smooth"})}}
function setLy(on){lyOn=on;sv("hm_ly",on?"1":"0");$("pop").classList.toggle("ly",on);$("lyb").classList.toggle("on",on);if(on)loadLy()}
$("lyb").onclick=()=>setLy(!lyOn);
$("lyr").onclick=e=>{const l=e.target.closest(".ll");if(l&&au.duration){au.currentTime=+l.dataset.s;lyU=0;lySync()}};
["touchstart","wheel"].forEach(ev=>$("lyr").addEventListener(ev,()=>{lyU=Date.now()},{passive:true}));
au.addEventListener("timeupdate",()=>lySync());au.addEventListener("seeked",()=>lySync());
$("pop").classList.toggle("ly",lyOn);$("lyb").classList.toggle("on",lyOn);
$("npo").onclick=()=>{if(cur)$("pop").classList.add("open")};
$("pcl").onclick=()=>$("pop").classList.remove("open");
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){load();mark();e.target.blur()}});

/* list clicks */
$("list").onclick=e=>{
  const b=e.target.closest(".ib");
  if(b){const i=+b.dataset.i;if(b.dataset.act==="add")openPicker(shown[i]);else if(b.dataset.act==="loc"){const t=shown[i];ask(T("delSong"),()=>delLoc(t))}else{const p=pls.find(x=>x.id===pid);p.tracks.splice(i,1);savePl();render()}return}
  const p=e.target.closest("[data-p]");if(p){pid=p.dataset.p;view="plist";window.scrollTo(0,0);return render()}
  const it=e.target.closest(".it");if(it){queue=shown.slice();const t=shown[+it.dataset.i];play(t);if(t.local)$("pop").classList.add("open")}
};
$("hsec").onclick=e=>{
  const b=e.target.closest("[data-h]");if(!b)return;const h=b.dataset.h;
  if(h==="clr")ask(T("clrH"),()=>{hist=[];sv("hm_hist","[]");render()});
  else if(h==="new")openPicker(null);
  else if(h==="addf")$("fi").click();
  else if(h==="back"){view="playlists";render()}
  else if(h==="all"){const p=pls.find(x=>x.id===pid);if(p.tracks.length){queue=p.tracks.slice();play(queue[0])}}
  else if(h==="del")ask(T("delPl"),()=>{pls=pls.filter(x=>x.id!==pid);savePl();view="playlists";render()});
};

/* playlists & modal */
const savePl=()=>sv("hm_pl",JSON.stringify(pls));
const openM=h=>{$("sheet").innerHTML=h;$("ov").classList.add("open")},closeM=()=>$("ov").classList.remove("open");
$("ov").onclick=e=>{if(e.target===$("ov"))closeM()};
$("padd").onclick=()=>{if(cur)openPicker(cur)};
function openPicker(t){
  pickT=t;
  openM(`<h3>${t?T("addTo"):T("newPlT")}</h3><div class="nr"><input id="npn" placeholder="${T("plName")}" maxlength="40"><button class="ok" id="npb">${ic("pu")}${T("create")}</button></div>`+
  (t?(pls.length?pls.map(p=>`<button class="pk" data-k="${p.id}"><span>${esc(p.name)}</span><small>${p.tracks.some(x=>x.id===t.id)?ic("ck"):""}</small></button>`).join(""):`<div class="a" style="padding:6px 2px">${T("noPl")}</div>`):""));
  setTimeout(()=>{const n=$("npn");if(n&&!t)n.focus()},50);
}
function ask(text,fn){openM(`<h3>${esc(text)}</h3><div class="row2"><button id="cn">${T("cancel")}</button><button class="dg" id="cy">${T("yes")}</button></div>`);$("cy").onclick=()=>{closeM();fn()};$("cn").onclick=closeM}
$("sheet").onclick=e=>{
  if(e.target.closest("#npb")){
    const n=$("npn").value.trim();if(!n)return;
    const p={id:Date.now().toString(36),name:n,tracks:[]};pls.unshift(p);
    if(pickT){p.tracks.push(lite(pickT));toast(T("added"))}
    savePl();closeM();if(view==="playlists")render();return}
  const k=e.target.closest("[data-k]");
  if(k){const p=pls.find(x=>x.id===k.dataset.k);
    if(p.tracks.some(x=>x.id===pickT.id))toast(T("already"));else{p.tracks.push(lite(pickT));savePl();toast(T("added"))}
    closeM();if(view==="playlists"||view==="plist")render()}
};
$("sheet").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="npn")$("npb").click()});

/* local songs (offline, IndexedDB) */
let loc=[],objU=null;
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open("hm_local",1);r.onupgradeneeded=()=>r.result.createObjectStore("s",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
const tx=async(m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction("s",m),q=f(t.objectStore("s"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const mem=new Map();
const dbGet=id=>mem.has(id)?Promise.resolve(mem.get(id)):tx("readonly",s=>s.get(id)).catch(()=>null);
const lcov=t=>t.cover||((loc.find(x=>x.id===t.id)||{}).cover)||"";
const mk=r=>({id:r.id,title:r.title,user:{name:r.artist||""},duration:r.duration,cover:r.cover,local:true,at:r.at});
tx("readonly",s=>s.getAll()).then(async a=>{a=a||[];loc=a.map(mk).sort((x,y)=>y.at-x.at);if(view==="local")render();
  for(const r of a){if(r.tg===2)continue;try{const g=await tags(r.file);if(g.title)r.title=g.title;if(g.artist)r.artist=g.artist;if(g.pic){const c=await cov(g.pic);if(c)r.cover=c}r.tg=2;await tx("readwrite",s=>s.put(r));const t=loc.find(x=>x.id===r.id);if(t)Object.assign(t,mk(r))}catch(e){}}
  if(view==="local")render();if(cur&&cur.local)setNow(cur)}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function delLoc(t){tx("readwrite",s=>s.delete(t.id)).then(()=>{loc=loc.filter(x=>x.id!==t.id);pls.forEach(p=>p.tracks=p.tracks.filter(x=>x.id!==t.id));savePl();hist=hist.filter(x=>x.id!==t.id);sv("hm_hist",JSON.stringify(hist));if(view==="local")render()})}
const dtx=d=>{const e=d[0],c=e===0?"windows-1252":e===3?"utf-8":e===2?"utf-16be":(d[1]===254&&d[2]===255?"utf-16be":"utf-16le");return new TextDecoder(c).decode(d.subarray(1)).replace(/\0/g,"").trim()};
function dpic(d,o){const e=d[0];let p=1;if(o)p=4;else{while(p<d.length&&d[p])p++;p++}
  p++;if(e===1||e===2){while(p+1<d.length&&(d[p]||d[p+1]))p+=2;p+=2}else{while(p<d.length&&d[p])p++;p++}
  return new Blob([d.subarray(p)])}
const be=(b,i)=>((b[i]<<24)|(b[i+1]<<16)|(b[i+2]<<8)|b[i+3])>>>0,le=(b,i)=>(b[i]|(b[i+1]<<8)|(b[i+2]<<16)|(b[i+3]<<24))>>>0;
const asc=(b,i,n)=>String.fromCharCode(...b.subarray(i,i+n)),u8t=d=>new TextDecoder("utf-8").decode(d);
const rd=async(f,a,n)=>new Uint8Array(await f.slice(a,a+n).arrayBuffer());
async function id3(f,o){const h=await rd(f,0,10),sz=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9],v=h[3],fl=h[5];
  let b=await rd(f,10,Math.min(sz,3e7));
  if(fl&128){const c=[];for(let i=0;i<b.length;i++){c.push(b[i]);if(b[i]===255&&b[i+1]===0)i++}b=Uint8Array.from(c)}
  let p=0;if((fl&64)&&v>2)p=v===4?((b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]):be(b,0)+4;
  const idl=v===2?3:4,hl=v===2?6:10;
  while(p+hl<=b.length){const id=asc(b,p,idl);if(!/^[A-Z0-9]+$/.test(id))break;
    const n=v===2?((b[p+3]<<16)|(b[p+4]<<8)|b[p+5]):v===4?((b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]):be(b,p+4);
    let s=p+hl;if(v===4&&(b[p+9]&1))s+=4;const end=p+hl+n,d=b.subarray(s,end);p=end;
    if(id==="TIT2"||id==="TT2")o.title=dtx(d);else if(id==="TPE1"||id==="TP1")o.artist=dtx(d);else if((id==="TPE2"||id==="TP2")&&!o.artist2)o.artist2=dtx(d);
    else if((id==="APIC"||id==="PIC")&&!o.pic)o.pic=dpic(d,v===2)}
  if(!o.artist&&o.artist2)o.artist=o.artist2}
async function id3v1(f,o){if(f.size<128)return;const b=await rd(f,f.size-128,128);if(asc(b,0,3)!=="TAG")return;
  const g=(i,n)=>new TextDecoder("windows-1252").decode(b.subarray(i,i+n)).split("\0")[0].trim();if(!o.title)o.title=g(3,30);if(!o.artist)o.artist=g(33,30)}
async function flac(f,o){let p=4;for(;;){const h=await rd(f,p,4);if(h.length<4)break;const t=h[0]&127,n=(h[1]<<16)|(h[2]<<8)|h[3];
  if(t===4){const b=await rd(f,p+4,n);let i=le(b,0)+4;const c=le(b,i);i+=4;
    for(let k=0;k<c&&i<b.length;k++){const l=le(b,i),s=u8t(b.subarray(i+4,i+4+l)),e=s.indexOf("="),K=s.slice(0,e).toUpperCase(),V=s.slice(e+1);i+=4+l;if(K==="TITLE")o.title=V;else if(K==="ARTIST"&&!o.artist)o.artist=V}}
  else if(t===6&&!o.pic){const b=await rd(f,p+4,Math.min(n,3e7));let i=4;i+=4+be(b,i);i+=4+be(b,i);i+=16;o.pic=new Blob([b.subarray(i+4,i+4+be(b,i))])}
  p+=4+n;if(h[0]&128)break}}
function mp4w(b,o,s,e){let p=s;while(p+8<=e){let n=be(b,p);const t=asc(b,p+4,4);if(n<8||p+n>e)n=e-p;
  if(t==="moov"||t==="udta"||t==="ilst")mp4w(b,o,p+8,p+n);else if(t==="meta")mp4w(b,o,p+12,p+n);
  else if(t==="\xa9nam"||t==="\xa9ART"||t==="aART"||t==="covr"){const d=p+8;if(asc(b,d+4,4)==="data"){const pl=b.subarray(d+16,d+be(b,d));
    if(t==="\xa9nam")o.title=u8t(pl);else if(t==="covr"){if(!o.pic)o.pic=new Blob([pl])}else if(t==="\xa9ART"||!o.artist)o.artist=u8t(pl)}}
  p+=n}}
async function mp4t(f,o){let p=0;while(p+8<=f.size){const h=await rd(f,p,16),dv=new DataView(h.buffer);let n=dv.getUint32(0);const t=asc(h,4,4);if(n===1)n=Number(dv.getBigUint64(8));if(n===0)n=f.size-p;
  if(t==="moov"){const b=await rd(f,p,Math.min(n,4e7));mp4w(b,o,0,b.length);return}if(n<8)break;p+=n}}
async function tags(f){const o={};try{const h=await rd(f,0,12);
  if(asc(h,0,3)==="ID3")await id3(f,o);else if(asc(h,0,4)==="fLaC")await flac(f,o);else if(asc(h,4,4)==="ftyp")await mp4t(f,o);
  if(!o.title||!o.artist)await id3v1(f,o)}catch(e){}
  return o}
async function cov(bl){try{const im=await createImageBitmap(bl),k=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85)}catch(e){return""}}
const durOf=f=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f),d=v=>{URL.revokeObjectURL(u);ok(v)};a.preload="metadata";a.onloadedmetadata=()=>d(isFinite(a.duration)?a.duration:0);a.onerror=()=>d(0);a.src=u});
$("fi").onchange=async e=>{const fs=[...e.target.files];e.target.value="";let n=0;
  for(const f of fs){if(!(f.type||"").startsWith("audio")&&!/\.(mp3|m4a|aac|flac|wav|ogg|opus|wma|amr|mp4)$/i.test(f.name)){toast(T("notAudio"));continue}try{const g=await tags(f),nm=f.name.replace(/\.[^.]+$/,"");let ti=g.title||nm,ar=g.artist||"";
      if(!g.title&&!ar&&nm.includes(" - "))[ar,ti]=nm.split(/ - (.+)/);
      const r={id:"L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:ti,artist:ar,duration:await durOf(f),cover:g.pic?await cov(g.pic):"",file:f,at:Date.now(),tg:2};
      try{await tx("readwrite",s=>s.put(r))}catch(x){mem.set(r.id,r);toast(T("memOnly"))}loc.unshift(mk(r));n++;if(view==="local")render()}catch(x){toast((x&&x.message)||String(x))}}
  if(n)toast(n+T("addedN"))};

document.body.classList.add("pause");
applyLang();load();
