name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p www assets && cp audius-player.html www/index.html && cp icon.png assets/icon-only.png && cp icon-foreground.png assets/icon-foreground.png && cp icon-background.png assets/icon-background.png
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - run: npm i -D @capacitor/assets
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hey-music-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
