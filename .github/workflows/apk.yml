name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p www assets && cp audius-player.html www/index.html && cp icon.png assets/icon-only.png
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android
      - run: npm i -D @capacitor/assets
      - run: npx cap add android
      - name: Set targetSdk 34 (restore normal status and navigation bars)
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle
      - name: Add immersive fullscreen and rotation support
        run: |
          D=android/app/src/main/java/com/robin/heymusic
          mkdir -p $D
          cat > $D/HeyBarsPlugin.java <<'EOF'
          package com.robin.heymusic;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Build;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "HeyBars")
          public class HeyBarsPlugin extends Plugin {
            public static boolean imm = false;

            @SuppressWarnings("deprecation")
            public static void apply(Activity a) {
              View d = a.getWindow().getDecorView();
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(a.getWindow(), d);
              if (imm) {
                if (Build.VERSION.SDK_INT >= 28) {
                  WindowManager.LayoutParams lp = a.getWindow().getAttributes();
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  a.getWindow().setAttributes(lp);
                }
                a.getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                a.getWindow().setStatusBarColor(Color.BLACK);
                a.getWindow().setNavigationBarColor(Color.BLACK);
                d.setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                c.hide(WindowInsetsCompat.Type.systemBars());
              } else {
                a.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                d.setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                c.show(WindowInsetsCompat.Type.systemBars());
              }
            }

            @PluginMethod
            public void immersive(final PluginCall call) {
              imm = Boolean.TRUE.equals(call.getBoolean("on", false));
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  apply(getActivity());
                  call.resolve();
                }
              });
            }

            @PluginMethod
            public void orient(final PluginCall call) {
              final int mode = call.getInt("mode", 0);
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  getActivity().setRequestedOrientation(mode == 1
                      ? ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      : mode == 2 ? ActivityInfo.SCREEN_ORIENTATION_PORTRAIT : ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  getActivity().getWindow().getDecorView().postDelayed(new Runnable() {
                    public void run() { apply(getActivity()); }
                  }, 400);
                  call.resolve();
                }
              });
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.robin.heymusic;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(HeyBarsPlugin.class);
              super.onCreate(savedInstanceState);
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus && HeyBarsPlugin.imm) HeyBarsPlugin.apply(this);
            }
          }
          EOF
      - name: Fix duplicate Kotlin classes
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
            configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
          }
          EOF
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hey-music-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
