<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মিউজিক সার্চ</title>
<style>
:root{--bg:#0f0f14;--card:#1a1a24;--ink:#f1f0f7;--mute:#9b9aae;--acc:#ff4e63;--line:#2a2a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.45;padding:12px 12px 130px;max-width:640px;margin-inline:auto}
.top{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:5}
input{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:11px 16px;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:24px;background:var(--line);color:var(--ink);padding:10px 16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.go{background:var(--acc);color:#1b0a0e;font-weight:600}
.item{display:flex;gap:12px;align-items:center;padding:8px 4px;border-radius:10px;cursor:pointer;width:100%;background:none;text-align:left;border-radius:10px}
.item.cur{background:var(--card)}
.item img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:var(--card)}
.item b{display:block;font-weight:600;font-size:.95rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item small{color:var(--mute)}
.msg{color:var(--mute);padding:20px 4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.in{max-width:640px;margin:auto;display:flex;gap:12px;align-items:center}
#box{width:128px;height:72px;border-radius:8px;overflow:hidden;background:#000;flex:none}
.meta{flex:1;min-width:0}
#now{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{display:flex;gap:6px;margin-top:6px}
.c button{padding:6px 14px;font-size:1.05rem}
#pp{background:var(--acc);color:#1b0a0e}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:420px;width:92%}
dialog::backdrop{background:#000a}
dialog input{width:100%;border-radius:10px;margin:8px 0}
dialog p{color:var(--mute);font-size:.88rem;margin:6px 0}
</style>
</head>
<body>
<div class="top">
  <input id="q" type="search" placeholder="গান, শিল্পী বা অ্যালবাম সার্চ করুন" enterkeyhint="search">
  <button class="go" id="s">সার্চ</button>
  <button id="cfg" aria-label="সেটিংস">⚙</button>
</div>
<div id="res"><p class="msg">গানের নাম লিখে সার্চ করুন।</p></div>

<div class="bar"><div class="in">
  <div id="box"><div id="p"></div></div>
  <div class="meta">
    <div id="now">কিছু চলছে না</div>
    <div class="c">
      <button id="pv" aria-label="আগের গান">⏮</button>
      <button id="pp" aria-label="চালান বা থামান">▶</button>
      <button id="nx" aria-label="পরের গান">⏭</button>
    </div>
  </div>
</div></div>

<dialog id="dlg">
  <b>YouTube API Key</b>
  <p>সার্চের জন্য একটি বিনামূল্যের YouTube Data API v3 কী লাগবে। কীটি শুধু এই ব্রাউজারে সেভ থাকে।</p>
  <input id="key" placeholder="AIza...">
  <button class="go" id="ks">সেভ করুন</button>
  <button id="kc">বন্ধ করুন</button>
</dialog>

<script>
const $=id=>document.getElementById(id);
let key=localStorage.getItem('ytkey')||'',list=[],cur=-1,yt=null,ready=false,playing=false,pend=null;
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};

function msg(t){const d=document.createElement('p');d.className='msg';d.textContent=t;$('res').replaceChildren(d)}

async function search(){
  const q=$('q').value.trim();if(!q)return;
  if(!key){$('dlg').showModal();return}
  msg('সার্চ হচ্ছে…');
  try{
    const u='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=25&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(key);
    const r=await fetch(u),j=await r.json();
    if(j.error){msg('ত্রুটি: '+j.error.message);return}
    list=(j.items||[]).map(i=>({id:i.id.videoId,t:dec(i.snippet.title),a:dec(i.snippet.channelTitle),
      img:(i.snippet.thumbnails.medium||i.snippet.thumbnails.default).url}));
    cur=-1;render();
    if(!list.length)msg('কিছু পাওয়া যায়নি');
  }catch(e){msg('সার্চ করা যায়নি। ইন্টারনেট দেখুন।')}
}

function render(){
  const f=document.createDocumentFragment();
  list.forEach((s,i)=>{
    const b=document.createElement('button');b.className='item'+(i===cur?' cur':'');
    const im=document.createElement('img');im.src=s.img;im.alt='';
    const w=document.createElement('div');
    const t=document.createElement('b');t.textContent=s.t;
    const a=document.createElement('small');a.textContent=s.a;
    w.append(t,a);b.append(im,w);b.onclick=()=>play(i);f.append(b);
  });
  $('res').replaceChildren(f);
}

function load(cb){
  if(window.YT&&YT.Player)return cb();
  window.onYouTubeIframeAPIReady=cb;
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>$('now').textContent='প্লেয়ার লোড হয়নি';document.head.append(s);
}

function setP(v){playing=v;$('pp').textContent=v?'⏸':'▶';
  if('mediaSession' in navigator)navigator.mediaSession.playbackState=v?'playing':'paused'}

function play(i){
  if(i<0||i>=list.length)return;
  cur=i;const s=list[i];
  document.querySelectorAll('.item').forEach((e,n)=>e.classList.toggle('cur',n===i));
  $('now').textContent=s.t;
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.t,artist:s.a,artwork:[{src:s.img}]});
  load(()=>{
    if(!yt){
      yt=new YT.Player('p',{width:'100%',height:'100%',videoId:s.id,playerVars:{autoplay:1,playsinline:1},events:{
        onReady:e=>{ready=true;e.target.playVideo()},
        onStateChange:e=>{if(e.data===1)setP(true);else if(e.data===2)setP(false);else if(e.data===0)next()},
        onError:()=>{$('now').textContent='চালানো যায়নি, পরেরটি চলছে…';setTimeout(next,1200)}}});
    }else if(ready)yt.loadVideoById(s.id);
  });
}
function next(){if(list.length)play(cur+1<list.length?cur+1:0)}
function prev(){if(list.length)play(cur>0?cur-1:list.length-1)}
function toggle(){if(cur<0){play(0);return}if(ready)playing?yt.pauseVideo():yt.playVideo()}

$('s').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('pp').onclick=toggle;$('nx').onclick=next;$('pv').onclick=prev;
$('cfg').onclick=()=>{$('key').value=key;$('dlg').showModal()};
$('kc').onclick=()=>$('dlg').close();
$('ks').onclick=()=>{key=$('key').value.trim();localStorage.setItem('ytkey',key);$('dlg').close();if($('q').value.trim())search()};
if('mediaSession' in navigator){const m=navigator.mediaSession;
  m.setActionHandler('play',toggle);m.setActionHandler('pause',toggle);
  m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev)}
if(!key)$('dlg').showModal();
</script>
</body>
</html>
